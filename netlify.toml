# Sitemap: Her istekte API'den canlı çekilir, canonical domain ile döner
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Admin panel SPA yönlendirmesi
[[redirects]]
  from = "/cpl-manage/*"
  to = "/index.html"
  status = 200

# Moderasyon paneli SPA yönlendirmesi
[[redirects]]
  from = "/mod/*"
  to = "/index.html"
  status = 200

# Mobil uygulamanın gömülü oyun sayfası: /embed.html dosya olarak servis edilir;
# /embed/* kısa yolları da SPA'ya (index.html) değil embed'e gider. Genel
# fallback'ten ÖNCE olmalı.
[[redirects]]
  from = "/embed"
  to = "/embed.html"
  status = 200

[[redirects]]
  from = "/embed/*"
  to = "/embed.html"
  status = 200

# Genel SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

