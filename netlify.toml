# Sitemap: Her istekte API'den canlı çekilir, canonical domain ile döner
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Admin panel SPA yönlendirmesi
[[redirects]]
  from = "/cpl-manage/*"
  to = "/index.html"
  status = 200

# Moderasyon paneli SPA yönlendirmesi
[[redirects]]
  from = "/mod/*"
  to = "/index.html"
  status = 200

# Genel SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

